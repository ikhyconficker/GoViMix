name: Build GoViMix Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Electron Builder
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps electron electron-builder

      - name: Build GoViMix Windows EXE
        run: npm run build:exe

      - name: Upload Windows .EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoViMix-Windows-EXE
          path: |
            release/GoViMix-Setup-*.exe
            release/GoViMix-Portable-*.exe
